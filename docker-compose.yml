version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3090:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # - DATABASE_URL=mongodb://mongo:27017/mantaupip # Uncomment if using local mongo below
    restart: always
